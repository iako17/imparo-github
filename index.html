<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Il mio primo sito</title>
  <style>
  body {
    background-color: #eaf1fa;
    font-family: Arial, sans-serif;
    text-align: center;
    padding: 25px;
  }

  h1 {
    color: #172554;
    font-size: 28px;
  }

  p {
    color: #475569;
    font-size: 17px;
  }

  button {
    background-color: #2563eb;
    color: white;
    padding: 14px 25px;
    border: none;
    border-radius: 10px;
    font-size: 18px;
  }
    nav {
  background-color: #172554;
  padding: 15px;
  border-radius: 10px;
}

nav a {
  color: white;
  text-decoration: none;
  margin: 8px;
  font-size: 16px;
}
    
section {
  min-height: 80vh;
  padding-top: 30px;
}
  
  </style>
</head>
<body>
  <nav>
  <a href="#home">Home</a>
  <a href="#chi-sono">Chi sono</a>
  <a href="#contatti">Contatti</a>
  </nav>
  <h1 id="home">Benvenuto nel mio sito!</h1>
  <p>Sto imparando a programmare
  con GitHub e ChatGPT.</p>
  <button onclick="cambiaTesto()">Cliccami!</button>

<p id="messaggio">Premi il pulsante!</p>
  <button onclick="cambiaColore()">
  Cambia colore
  </button>
<section id="chi-sono">
  <h2>Chi sono</h2>
  <p>Sto imparando a creare siti web
  e applicazioni con GitHub e ChatGPT.</p>
</section>

<section id="contatti">
  <h2>Contatti</h2>
  <p>Questa è la sezione dei contatti
  del mio primo sito web.</p>
</section>
  
<script>
  function cambiaTesto() {
    document.getElementById("messaggio").innerText =
      "sto imparando JavaScript e presto creerò la mia prima applicazione";
  }
  
function cambiaColore() {
  document.body.style.backgroundColor = "lightred";
}
  
</script>
  
</body>
</html>
